name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Create or switch to keepalive branch
        run: |
          if git ls-remote --exit-code --heads origin keepalive; then
            git fetch origin keepalive:keepalive
            git switch keepalive
          else
            git switch -c keepalive
          fi

      - name: Create keepalive commit
        run: |
          git commit --allow-empty -m "keepalive $(date -u +%F)"

      - name: Push
        run: |
          git push -u origin keepalive
